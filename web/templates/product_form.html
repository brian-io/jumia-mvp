{{define "product_form.html"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<div class="container">
  <div class="form-card form-card-md">
    <div class="form-title">Add New Product</div>
    <div class="form-subtitle">List a product on Agora marketplace</div>

    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}

    <form method="post" action="/seller/products/new">
      <div class="form-group">
        <label>Product name *</label>
        <input type="text" name="name" placeholder="e.g. Samsung Galaxy A54" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" placeholder="Describe your product..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Price (KSh) *</label>
          <input type="number" name="price" placeholder="0.00" step="0.01" min="1" required>
        </div>
        <div class="form-group">
          <label>Stock quantity *</label>
          <input type="number" name="stock" placeholder="10" min="0" required>
        </div>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select name="category">
          <option value="">Select category</option>
          <option>Electronics</option>
          <option>Fashion</option>
          <option>Home &amp; Kitchen</option>
          <option>Groceries</option>
          <option>Sports</option>
          <option>Books</option>
          <option>Health &amp; Beauty</option>
          <option>Automotive</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Product icon</label>
        <input type="text" name="image_url" placeholder="e.g. 📱 or 👟 or 🎧" maxlength="10">
        <div class="form-help">Shown as your product's thumbnail across the marketplace.</div>
      </div>

      <button type="submit" class="btn btn-orange btn-block">List Product &rarr;</button>
    </form>

    <div class="form-footer"><a href="/seller/dashboard">&larr; Back to Dashboard</a></div>
  </div>
</div>
{{end}}
