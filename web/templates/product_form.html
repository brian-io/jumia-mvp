{{define "product_form.html"}}
{{template "base" .}}
{{end}}
{{define "content_product_form"}}
<div class="container">
  <div class="form-card" style="max-width:560px">
    <div class="form-title">Add New Product</div>
    <div class="form-subtitle">List a product on Jumia marketplace</div>

    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}

    <form method="post" action="/seller/products/new">
      <div class="form-group">
        <label>Product name *</label>
        <input type="text" name="name" placeholder="e.g. Samsung Galaxy A54" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" placeholder="Describe your product..."></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label>Price (KSh) *</label>
          <input type="number" name="price" placeholder="0.00" step="0.01" min="1" required>
        </div>
        <div class="form-group">
          <label>Stock quantity *</label>
          <input type="number" name="stock" placeholder="10" min="0" required>
        </div>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select name="category">
          <option value="">Select category</option>
          <option>Electronics</option>
          <option>Fashion</option>
          <option>Home & Kitchen</option>
          <option>Groceries</option>
          <option>Sports</option>
          <option>Books</option>
          <option>Health & Beauty</option>
          <option>Automotive</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Emoji icon (used as product image)</label>
        <input type="text" name="image_url" placeholder="e.g. 📱 or 👟 or 🎧" maxlength="10">
      </div>
      <button type="submit" class="btn btn-orange" style="width:100%;padding:12px;font-size:16px">List Product →</button>
    </form>
    <div class="form-footer"><a href="/seller/dashboard">← Back to Dashboard</a></div>
  </div>
</div>
{{end}}
