{{define "login.html"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<div class="container">
  <div class="form-card">
    <div class="form-title">Welcome Back!</div>
    <div class="form-subtitle">Login to your Agora account</div>

    {{if .Message}}<div class="success-msg">{{.Message}}</div>{{end}}
    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}

    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <div class="form-group">
        <label>Email address</label>
        <input
          type="email"
          name="email"
          placeholder="you@example.com"
          required
          autofocus
          maxlength="254"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="Your password"
          required
          minlength="8"
          maxlength="72"
        >
      </div>

      <button type="submit" class="btn btn-orange btn-block">Login &rarr;</button>
    </form>

    <div class="form-footer">
      Don't have an account? <a href="/register">Sign up free</a>
    </div>
  </div>
</div>
{{end}}
