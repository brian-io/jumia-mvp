{{define "register.html"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<div class="container">
  <div class="form-card">
    <div class="form-title">Create Account</div>
    <div class="form-subtitle">Join millions of Kenyans shopping on Agora</div>

    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}

    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <div class="form-group">
        <label>Full name</label>
        <input type="text" name="name" placeholder="John Kamau" required autofocus maxlength="200">
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required maxlength="254">
      </div>
      <div class="form-group">
        <label>Password (8–72 characters)</label>
        <input type="password" name="password" placeholder="Create a strong password" required minlength="8" maxlength="72">
      </div>
      <div class="form-group">
        <label>Account type</label>
        <select name="role">
          <option value="buyer">Buyer &mdash; I want to shop</option>
          <option value="seller">Seller &mdash; I want to sell products</option>
        </select>
      </div>
      <button type="submit" class="btn btn-orange btn-block">Create Account &rarr;</button>
    </form>

    <div class="form-footer">
      Already have an account? <a href="/login">Login here</a>
    </div>
  </div>
</div>
{{end}}
